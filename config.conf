# Touch Rate Sync configuration.
# Durations are seconds. POLL_INTERVAL must be an integer; WATCHDOG_INTERVAL
# may be fractional because it is only passed to sleep.
POLL_INTERVAL=3
WATCHDOG_INTERVAL=1.5

# refresh:report-rate mapping.
# PLF110/S3910 accepts only these report rates: 120 180 240 288 360.
# 288 is the raw node value; with 288hz_to_300hz_report_rate_support=1 the
# effective touch report rate is 300Hz for the 120Hz display mode.
RATE_MAP="30:120 60:120 90:180 120:288 144:360"
# refresh:raw-node-rate:effective-rate
EFFECTIVE_RATE_MAP="120:288:300 144:360:320"

# Fallback for an unmapped refresh rate: nearest, nearest_high, floor, ceil.
# The default 2.5x target is used before applying this fallback.
FALLBACK=nearest_high
SCALE_NUM=5
SCALE_DEN=2

# 0 = synchronise whenever the screen is on.
# 1 = synchronise only for packages listed in apps.txt.
ONLY_FOR_LISTED_APPS=0
APP_LIST_FILE=apps.txt

# Restore this value when the display turns off, the app is not listed,
# the module is disabled, or the daemon exits.
RESTORE_RATE=0
RESTORE_ON_EXIT=1

# Log state changes but do not write the touch node.
DRY_RUN=0

LOG_MAX_BYTES=131072
TOUCH_HIDL=/odm/bin/touchHidlTest
TOUCH_NODE=182
HIDL_DEVICE=0

# Device gate. Both values must match or the service will not start.
ALLOWED_MODELS="PLF110"
ALLOWED_PROJECTS="24825"


